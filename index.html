<style>
/* Concept : fiche de chantier. Colonne de saisie fixe à gauche, verdict financier en tête, détail métré en tableaux éditables.
   Seule audace : la barre coût / chiffre d'affaires à la même échelle, qui montre le gain ou le manque d'un coup d'œil. */
:root{
  --bg:#E9ECEE; --surface:#F6F7F8; --ink:#15202A; --muted:#566471; --line:#CDD3D8; --line2:#B3BBC2;
  --accent:#2A3FD1; --on-accent:#FFFFFF; --accent-soft:#DDE1F8;
  --gain:#0C7653; --gain-soft:#D5EDE4; --loss:#B02F1C; --loss-soft:#F5DAD4; --warn-soft:#F3E7CC;
  --c1:#2A3FD1; --c2:#8794E8; --c3:#C0801A; --c4:#1B8468; --c5:#8C95A0;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#17212A; --ink:#E6EBEF; --muted:#93A1AD; --line:#2A3743; --line2:#3C4B59;
  --accent:#8C9AFF; --on-accent:#0F161C; --accent-soft:#232C57;
  --gain:#4CC79B; --gain-soft:#143429; --loss:#FF907A; --loss-soft:#432019; --warn-soft:#3A3018;
  --c1:#8C9AFF; --c2:#4B59B8; --c3:#E3AB4B; --c4:#4CC79B; --c5:#6F7B88; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#17212A; --ink:#E6EBEF; --muted:#93A1AD; --line:#2A3743; --line2:#3C4B59;
  --accent:#8C9AFF; --on-accent:#0F161C; --accent-soft:#232C57;
  --gain:#4CC79B; --gain-soft:#143429; --loss:#FF907A; --loss-soft:#432019; --warn-soft:#3A3018;
  --c1:#8C9AFF; --c2:#4B59B8; --c3:#E3AB4B; --c4:#4CC79B; --c5:#6F7B88; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{flex:none;color:var(--ink)}
.top h1{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.brand .tag{display:block;margin-top:5px;font-size:12.5px;font-weight:600;color:var(--accent)}
.top p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:940px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:940px){aside{position:static;max-height:none}}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend,.lab{font-weight:700;font-size:13px;padding:0;margin-bottom:2px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;background:transparent;color:var(--ink);border:0;border-right:1px solid var(--line2);padding:9px 6px;cursor:pointer;min-width:0}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px;align-items:center}
.field label{font-size:13.5px}
.inp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:5px;background:var(--bg);min-width:0}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;padding:8px 8px;text-align:right}
.inp span{padding-right:8px;color:var(--muted);font-size:12px;white-space:nowrap}
.inp:focus-within{border-color:var(--accent)}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:5px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
details summary{cursor:pointer;font-weight:700;font-size:13px}
details[open] summary{margin-bottom:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--accent)}
/* Verdict */
.verdict{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;padding-bottom:22px;border-bottom:2px solid var(--ink);margin-bottom:22px}
@media(max-width:760px){.verdict{grid-template-columns:minmax(0,1fr);gap:16px}}
.vlabel{margin:0;font-weight:700;font-size:14px}
.vnum{margin:2px 0 4px;font-family:var(--f-display);font-weight:800;font-size:clamp(40px,7vw,68px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.vnum small{font-size:.38em;font-weight:600;letter-spacing:0;margin-left:6px}
.vnum.pos{color:var(--gain)} .vnum.neg{color:var(--loss)}
.vsub{margin:0;color:var(--muted);font-size:14px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin:0;align-content:start}
.kpi div{padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.kpi dt{font-size:12.5px;color:var(--muted)}
.kpi dd{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
/* Onglets */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line2);margin-bottom:22px}
.tabs button{font:inherit;font-weight:600;font-size:14px;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
section.pane{display:flex;flex-direction:column;gap:26px}
.pane h2{font-size:19px;font-weight:600;margin-bottom:8px}
.pane p{margin:0}
/* Barres */
.barrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:10px}
@media(max-width:560px){.barrow{grid-template-columns:minmax(0,1fr)}}
.barrow .bl{font-size:13px;font-weight:600}
.bar{display:flex;height:34px;border-radius:3px;overflow:hidden;background:transparent}
.bar i{display:block;height:100%;min-width:0}
.bar .s1{background:var(--c1)}.bar .s2{background:var(--c2)}.bar .s3{background:var(--c3)}.bar .s4{background:var(--c4)}.bar .s5{background:var(--c5)}
.bar .cover{background:var(--line2)}
.bar .gain{background:var(--gain)}
.bar .loss{background:repeating-linear-gradient(135deg,var(--loss) 0 6px,var(--loss-soft) 6px 12px)}
.bar-note{font-size:12.5px;color:var(--muted);margin:2px 0 0 142px}
@media(max-width:560px){.bar-note{margin-left:0}}
/* Tableaux */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--bg)}
td.lbl{white-space:normal;min-width:200px}
td.u{text-align:left;color:var(--muted);font-size:13px}
tr.gh th{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:15px;text-align:left}
tr.gh th span{float:right;font-variant-numeric:tabular-nums}
tr.sum td,tr.sum th{font-weight:700;border-top:2px solid var(--ink);background:var(--bg)}
tr.hl td,tr.hl th{background:var(--accent-soft)}
.tw td input{width:92px;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;text-align:right;padding:4px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.tw td input:hover{border-color:var(--line2)}
.tw td input.mod{background:var(--warn-soft);border-color:var(--line2)}
.tw td input.wide{width:104px}
.pos-t{color:var(--gain);font-weight:700}.neg-t{color:var(--loss);font-weight:700}
.chip{display:inline-block;font-size:11.5px;font-weight:700;background:var(--gain);color:var(--bg);border-radius:3px;padding:1px 6px;margin-left:6px}
.surf3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px}
@media(max-width:560px){.surf3{grid-template-columns:minmax(0,1fr)}}
.surf3 div{padding:8px 0;border-bottom:1px solid var(--line)}
.surf3 b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.surf3 span{color:var(--muted);font-size:13px}
.geo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.geo{grid-template-columns:minmax(0,1fr)}}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:13.5px}
.notes ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.ax{padding:12px 0;border-bottom:1px solid var(--line);max-width:760px}
.ax h3{font-size:15px;font-weight:600}
.ax .fm{margin:6px 0;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;font-size:13.5px}
.ax .vv{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;color:var(--accent);overflow-wrap:anywhere}
.ax .nt{color:var(--muted);font-size:13px;margin-top:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:5px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 56 56" width="58" height="58" role="img" aria-label="Croquis d'un immeuble R+2 avec balcons en encorbellement" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M3 52h50" stroke-width="2.2"/>
        <rect x="14" y="38" width="26" height="14"/>
        <rect x="10" y="24" width="30" height="14"/>
        <rect x="10" y="10" width="30" height="14"/>
        <path d="M10 7h30v3" stroke="var(--accent)" stroke-width="2.2"/>
        <rect x="18" y="43" width="7" height="9" fill="var(--accent)" stroke="none"/>
        <rect x="29" y="44" width="6" height="5"/>
        <rect x="15" y="28" width="6" height="6"/><rect x="29" y="28" width="6" height="6"/>
        <rect x="15" y="14" width="6" height="6"/><rect x="29" y="14" width="6" height="6"/>
        <path d="M10 38h-4M10 24h-4M6 38v-4M6 24v-4" stroke="var(--accent)"/>
        <path d="M46 52V16M43 19l3-4 3 4" stroke-width="1.4"/>
      </svg>
      <div><h1>Skyimmo</h1><span class="tag">Immeuble en R+2</span></div>
    </div>
    <p>Coût de revient, prix de vente et gain d'un lot de terrain, avec le nombre d'étages de votre choix. Montants en dirhams (DH).</p>
  </header>
  <div class="grid">
    <aside id="aside" aria-label="Paramètres du projet"></aside>
    <main id="main"></main>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
var KEY="maroc-btp-immo-v1";
var DEF={
  cfg:1,nEt:2,S:100,pT:3500,sol:"dur",pv:7000,scen:"haut",scale:true,imp:0,argPct:50,tab:"rent",
  edit:false,
  geo:{1:{cour:10,murs:10,enc:10,cage:0,esc:22,ter:20},2:{cour:0,murs:10,enc:5.6,cage:0,esc:22,ter:20},3:{cour:0,murs:10,enc:8,cage:0,esc:22,ter:20}},
  fees:{dgi:4,anc:1.5,ancFix:150,ancCert:100,not:1,notMin:2500,tva:20,deb:2000,archi:3.5,bet:12000,taxe:7000,racc:15000},
  ov:{}
};
function clone(o){return JSON.parse(JSON.stringify(o));}
var S=load();
function load(){
  var d=clone(DEF);
  try{
    var r=JSON.parse(localStorage.getItem(KEY)||"null");
    if(r&&typeof r==="object"){
      Object.keys(d).forEach(function(k){
        if(r[k]===undefined)return;
        if(k==="geo"){[1,2,3].forEach(function(c){Object.assign(d.geo[c],(r.geo||{})[c]||{});});}
        else if(k==="fees"){Object.assign(d.fees,r.fees);}
        else d[k]=r[k];
      });
    }
  }catch(e){}
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Format ---------- */
var nf0=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
var nf1=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:1});
var nf2=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
function f0(n){return nf0.format(Math.round(n));}
function f1(n){return nf1.format(n);}
function f2(n){return nf2.format(n);}
function dh(n){return f0(n)+" DH";}
function raw(n){return String(+(+n).toFixed(4));}

/* ---------- Calcul ---------- */
function lvl(i){return i===0?"RDC":(i===1?"1er étage":i+"ème étage");}
function compute(st,cfg){
  var g=st.geo[cfg],A=st.S;
  var rdc=A-g.cour-g.murs,et=rdc+g.enc;
  var nL=1+st.nEt,hab=[],comm=0;
  for(var u=0;u<nL;u++){hab.push(u?et:rdc);comm+=hab[u]-g.cage;}
  var emprise=A-g.cour,terr=(nL>1?et:rdc)+g.ter;
  var k=st.scale?A/100:1;
  var lines=[];
  function sc(lo,hi){return st.scen==="bas"?lo:(st.scen==="haut"?hi:(lo+hi)/2);}
  function add(sec,grp,id,label,unit,q,p){
    var o=st.ov[id]||{},mq=o.q!=null,mp=o.p!=null;
    lines.push({sec:sec,grp:grp,id:id,label:label,unit:unit,q:mq?o.q:q,p:mp?o.p:p,mq:mq,mp:mp});
  }
  var G="Fondations";
  add("go",G,"fond_mo","Main-d'œuvre fondations","m²",emprise,sc(120,125));
  add("go",G,"fond_h1","Pierres de fondation (Hajar), lot de 30 m³","lot",k,2000);
  add("go",G,"fond_h2","Pierres de fondation (Hajar), lot de 6 m³","lot",k,1000);
  add("go",G,"fond_c45","Ciment CPJ 45 (béton armé)","sac 50 kg",150*k,82);
  if(st.sol==="argile"){
    var base=0;lines.forEach(function(l){if(l.grp===G)base+=l.q*l.p;});
    add("go",G,"fond_arg","Surcoût double chaînage (sol argileux)","forfait",1,base*st.argPct/100);
  }
  for(var i=0;i<nL;i++){
    var n=lvl(i),e="e"+i+"_";
    add("go",n,e+"mo","Main-d'œuvre élévation","m²",hab[i],sc(240,250));
    add("go",n,e+"c45","Ciment CPJ 45 (béton armé)","sac 50 kg",120*k,82);
    add("go",n,e+"c35","Ciment CPJ 35 (mortier, maçonnerie)","sac 50 kg",80*k,78);
    add("go",n,e+"f6","Fer rond lisse 6 mm","quintal",2*k,sc(880,900));
    add("go",n,e+"fha","Fer H.A. 10 et 12 mm","quintal",10*k,sc(880,900));
    add("go",n,e+"b12","Briques rouges de 12 (murs extérieurs)","unité",(i?2800:2600)*k,sc(3.2,3.8));
    add("go",n,e+"b8","Briques rouges de 8 (cloisons)","unité",(i?1800:1600)*k,sc(2.5,2.8));
    add("go",n,e+"hrd","Hourdis et poutrelles (El Ourdi)","m² dalle",(i?110:100)*k,100);
  }
  add("go","Terrasse et acrotère","t_mo","Main-d'œuvre terrasse / acrotère (Sitra)","m²",terr,100);
  add("go","Terrasse et acrotère","t_c45","Ciment CPJ 45 (béton armé)","sac 50 kg",50*k,82);
  add("go","Terrasse et acrotère","t_b12","Briques rouges de 12","unité",1600*k,sc(3.2,3.8));
  var C="Approvisionnements communs";
  add("go",C,"c_grav","Gravier de carrière (Kyas), camion de 25 m³","camion",Math.ceil(4*k-1e-9),3500);
  add("go",C,"c_sable","Sable de mer (Remla), camion de 22 m³","camion",Math.ceil(5*k-1e-9),6000);
  add("go",C,"c_quinc","Quincaillerie de coffrage (fil de fer, clous)","kg",80*k,15);
  add("go",C,"c_pvc","Tuyaux d'évacuation PVC Ø200","m",30*k,50);

  for(var j=0;j<nL;j++){
    var m=lvl(j),s="s"+j+"_";
    add("so",m,s+"plat","Plâtre et staff (jibs)","m²",hab[j],130);
    add("so",m,s+"carr","Carrelage / zellige posé","m²",130*k,150);
    add("so",m,s+"marb","Marbre (escalier et cadres)","m²",g.esc,500);
    add("so",m,s+"pint","Peinture intérieure (MO + fournitures)","forfait",k,8000);
    add("so",m,s+"alu","Menuiserie aluminium (fenêtres, rideaux)","forfait",1,(j?14000:10500));
    add("so",m,s+"bois","Portes en bois","porte",(j?5:4),2000);
    if(j===0)add("so",m,"s0_blind","Porte blindée","pièce",1,4000);
    add("so",m,s+"ferro","Grilles et inox d'escalier","forfait",1,6000);
    add("so",m,s+"sani","Sanitaires (salle de bain et WC)","forfait",1,4000);
    add("so",m,s+"plac","Placard intégré","appartement",1,7000);
    add("so",m,s+"cuis","Cuisine équipée (gamme supérieure)","appartement",1,20000);
  }
  add("so","Terrasse et façades","st_carr","Carrelage terrasse","m²",terr,150);
  add("so","Terrasse et façades","st_porte","Porte de terrasse","pièce",1,2500);
  add("so","Terrasse et façades","sf_pext","Peinture extérieure (Grifi), façades et terrasse","forfait",k,8000);

  var go=0,so=0;
  lines.forEach(function(l){l.t=l.q*l.p;if(l.sec==="go")go+=l.t;else so+=l.t;});
  var F=st.fees,pT=A*st.pT;
  var dgi=pT*F.dgi/100,anc=pT*F.anc/100+F.ancFix+F.ancCert;
  var not=Math.max(pT*F.not/100,F.notMin),tva=not*F.tva/100;
  var tAEM=pT+dgi+anc+not+tva+F.deb;
  var archi=go*F.archi/100,honTax=archi+F.bet+F.taxe;
  var imp=(go+so)*st.imp/100;
  var cost=tAEM+honTax+go+so+F.racc+imp;
  var ca=comm*st.pv,marge=ca-cost;
  return {g:g,rdc:rdc,et:et,hab:hab,comm:comm,emprise:emprise,terr:terr,k:k,lines:lines,go:go,so:so,
    pT:pT,dgi:dgi,anc:anc,not:not,tva:tva,tAEM:tAEM,archi:archi,honTax:honTax,imp:imp,racc:F.racc,
    cost:cost,ca:ca,marge:marge,mm2:marge/comm,roi:marge/cost*100,eq:cost/comm};
}

/* ---------- Rendu : briques ---------- */
function field(id,label,path,val,suf,wide){
  return '<div class="field"><label for="'+id+'">'+label+'</label><div class="inp"><input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" data-path="'+path+'" value="'+raw(val)+'"><span>'+suf+'</span></div></div>';
}
function seg(act,cur,opts){
  return '<div class="seg" role="group">'+opts.map(function(o){
    return '<button type="button" data-act="'+act+'" data-v="'+o[0]+'" aria-pressed="'+(String(cur)===String(o[0]))+'">'+o[1]+'</button>';
  }).join("")+'</div>';
}
function barRow(label,segs,max,note){
  var inner=segs.map(function(s){var w=max>0?Math.max(0,s[1])/max*100:0;return '<i class="'+s[0]+'" style="width:'+w+'%"'+(s[2]?' title="'+s[2]+'"':'')+'></i>';}).join("");
  return '<div class="barrow"><span class="bl">'+label+'</span><div class="bar" role="img" aria-label="'+(note||label)+'">'+inner+'</div></div>';
}
function nOv(){return Object.keys(S.ov).length;}

  h+='<span class="lab">Nature du sol</span>'+seg("sol",S.sol,[["dur","Sol dur"],["argile","Argileux"]])+'</fieldset>';

/* ---------- Onglet Rentabilité ---------- */
function paneRent(m){
  var cats=[["s1","Terrain acte en main",m.tAEM],["s2","Honoraires, BET et taxes",m.honTax],["s3","Gros œuvre",m.go],["s4","Finitions (second œuvre)",m.so],["s5","Raccordements et imprévus",m.racc+m.imp]];
  var max=Math.max(m.cost,m.ca);
  var costSegs=cats.map(function(c){return [c[0],c[2],c[1]+" : "+dh(c[2])];});
  var caSegs=[["cover",Math.min(m.ca,m.cost),"Coût couvert"]];
  if(m.ca>=m.cost)caSegs.push(["gain",m.ca-m.cost,"Gain"]);else caSegs.push(["loss",m.cost-m.ca,"Manque"]);
  var h='<section class="pane" id="p-rent">';
  h+='<div><h2>Coût de revient face au chiffre d\'affaires</h2>'
    +barRow("Coût de revient",costSegs,max,"Coût de revient "+dh(m.cost))
    +barRow("Chiffre d'affaires",caSegs,max,"Chiffre d'affaires "+dh(m.ca))
    +'<p class="bar-note">'+(m.marge>=0?"La part verte est le gain : "+dh(m.marge)+".":"La part hachurée est le manque à gagner : "+dh(-m.marge)+".")+'</p></div>';
  h+='<div class="tw"><table><thead><tr><th>Poste du coût de revient</th><th>Montant</th><th>Part</th><th>Par m² vendable</th></tr></thead><tbody>';
  cats.forEach(function(c){h+='<tr><td><span class="bar" style="display:inline-flex;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:8px"><i class="'+c[0]+'" style="width:100%"></i></span>'+c[1]+'</td><td>'+dh(c[2])+'</td><td>'+f1(c[2]/m.cost*100)+' %</td><td>'+f0(c[2]/m.comm)+' DH</td></tr>';});
  h+='<tr class="sum"><td>Coût de revient total</td><td>'+dh(m.cost)+'</td><td>100 %</td><td>'+f0(m.eq)+' DH</td></tr></tbody></table></div>';

  // Sensibilité au prix de vente
  h+='<div><h2>Gain selon le prix de vente</h2><div class="tw"><table><thead><tr><th>Prix de vente</th><th>Chiffre d\'affaires</th><th>Gain</th><th>ROI</th></tr></thead><tbody>';
  [-1000,-500,0,500,1000].forEach(function(d){
    var p=S.pv+d,ca=p*m.comm,mg=ca-m.cost;
    h+='<tr'+(d===0?' class="hl"':'')+'><td>'+f0(p)+' DH/m²'+(d===0?' (votre prix)':'')+'</td><td>'+dh(ca)+'</td><td class="'+(mg>=0?"pos-t":"neg-t")+'">'+(mg>=0?"+":"−")+" "+f0(Math.abs(mg))+' DH</td><td>'+f1(mg/m.cost*100)+' %</td></tr>';
  });
  h+='</tbody></table></div><p class="hint" style="margin-top:8px">Le gain devient nul à '+f0(m.eq)+' DH/m².</p></div>';

  // Comparaison des façades
  var ms=[1,2,3].map(function(c){return compute(S,c);});
  var best=0;ms.forEach(function(x,i){if(x.marge>ms[best].marge)best=i;});
  h+='<div><h2>Comparaison 1, 2 et 3 façades</h2><p class="hint" style="margin-bottom:8px">Mêmes prix et mêmes frais, seule la géométrie du lot change.</p><div class="tw"><table><thead><tr><th></th>'
   +ms.map(function(x,i){return '<th>'+(i+1)+' façade'+(i?'s':'')+(i===best?'<span class="chip">Meilleur gain</span>':'')+'</th>';}).join("")+'</tr></thead><tbody>';
  function row(lbl,fn,cls){return '<tr><td>'+lbl+'</td>'+ms.map(function(x,i){return '<td class="'+(cls?cls(x):'')+'">'+fn(x)+'</td>';}).join("")+'</tr>';}
  h+=row("Surface habitable nette",function(x){return f2(x.comm)+" m²";});
  h+=row("Coût de revient",function(x){return dh(x.cost);});
  h+=row("Chiffre d'affaires",function(x){return dh(x.ca);});
  h+=row("Gain",function(x){return (x.marge>=0?"+":"−")+" "+f0(Math.abs(x.marge))+" DH";},function(x){return x.marge>=0?"pos-t":"neg-t";});
  h+=row("ROI",function(x){return f1(x.roi)+" %";});
  h+=row("Prix d'équilibre",function(x){return f0(x.eq)+" DH/m²";});
  h+='</tbody></table></div></div>';

  h+='<details class="notes"><summary>Hypothèses à vérifier</summary><ul>'
   +'<li>Pierres de fondation (Hajar) : les 3 000 DH sont lus comme deux lots forfaitaires, 30 m³ à 2 000 DH et 6 m³ à 1 000 DH. Au prix par m³, la ligne coûterait 66 000 DH.</li>'
   +'<li>3 façades : la fiche ne donne pas de règle. Cour 0 m², murs 10 m², encorbellement 8 m² par étage. À ajuster dans Surfaces, bouton « Modifier les métrés ».</li>'
   +'<li>Fer à béton : 2 quintaux de rond et 10 quintaux de H.A. pour chacun des '+(S.nEt+1)+' niveaux (RDC compris), sans fer séparé pour fondations et terrasse.</li>'
   +'<li>Surface de terrasse : surface d\'un étage + 20 m² (escalier, acrotère). Elle donne 110 m² pour un lot de 100 m² à 1 façade.</li>'
   +'<li>Sol argileux : surcoût de '+S.argPct+' % sur le sous-total des fondations pour le double chaînage. Valeur proposée, non issue de la fiche.</li>'
   +'<li>Main-d\'œuvre de fondation : calculée sur la surface au sol hors cour. Élévation et plâtre : surface habitable de chaque niveau.</li>'
   +'<li>Imprévus : '+S.imp+' % par défaut. La formule de la fiche n\'en prévoit pas.</li></ul></details>';
  return h+'</section>';
}

/* ---------- Onglets métré ---------- */
function paneLines(sec,title,total,m){
  var lines=m.lines.filter(function(l){return l.sec===sec;});

  var h='<section class="pane" id="p-'+sec+'"><div><h2>'+title+'</h2><p class="hint">Quantités et prix unitaires modifiables. Une cellule surlignée s\'écarte de la valeur calculée.'
   +(nOv()?' <button type="button" class="btn" data-act="resetov" style="margin-left:6px">Rétablir les valeurs calculées ('+nOv()+')</button>':'')+'</p></div>';
  h+='<div class="tw"><table><thead><tr><th>Désignation</th><th>Quantité</th><th>Unité</th><th>Prix unitaire (DH)</th><th>Total (DH)</th></tr></thead>';
  groups.forEach(function(gr){
    var ls=lines.filter(function(l){return l.grp===gr;}),sub=0;ls.forEach(function(l){sub+=l.t;});
    h+='<tbody><tr class="gh"><th colspan="5">'+gr+'<span>'+f0(sub)+' DH</span></th></tr>';

      h+='<tr><td class="lbl">'+l.label+'</td>'
       +'<td><input id="q_'+l.id+'" type="text" inputmode="decimal" autocomplete="off" data-path="ov.'+l.id+'.q" class="'+(l.mq?'mod':'')+'" value="'+raw(l.q)+'" aria-label="Quantité : '+l.label+'"></td>'
       +'<td class="u">'+l.unit+'</td>'
       +'<td><input id="p_'+l.id+'" type="text" inputmode="decimal" autocomplete="off" data-path="ov.'+l.id+'.p" class="wide '+(l.mp?'mod':'')+'" value="'+raw(l.p)+'" aria-label="Prix unitaire : '+l.label+'"></td>'

    h+='</tbody>';
  });
  h+='<tfoot><tr class="sum"><td colspan="4">'+title+', total</td><td>'+f0(total)+'</td></tr></tfoot></table></div></section>';
  return h;
}

/* ---------- Onglet Annexe : méthode de calcul ---------- */
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function paneAnnex(m){

   ["Second œuvre","Marbre d'escalier et cadres","Quantité de marbre par niveau × 500 DH/m².","RDC : "+L("s0_marb"),"C'est une quantité de marbre à acheter, pas l'emprise de l'escalier."],
   ["Second œuvre","Peintures","Intérieur : 8 000 DH par niveau (4 000 de main-d'œuvre + 4 000 de fournitures). Extérieur (Grifi) : 8 000 DH pour façades et terrasse. Multipliés par le facteur d'échelle.","Intérieur RDC : "+L("s0_pint")+" ; extérieur : "+L("sf_pext"),""],

   ["Second œuvre","Sanitaires, placards, cuisines","Sanitaires : 4 000 DH par niveau. Placard : 7 000 DH par appartement. Cuisine équipée : 20 000 DH par appartement. Un appartement par niveau.","Cuisines : "+nl+" × 20 000 = "+dh(nl*20000),""],
   ["Second œuvre","Total second œuvre","Somme de toutes les lignes du second œuvre.",dh(m.so),""],
   ["Terrain et frais","Prix d'achat du terrain","Surface du terrain × prix au m².",f2(A)+" × "+f0(S.pT)+" = "+dh(pT),""],
   ["Terrain et frais","Droits d'enregistrement DGI","Taux × prix d'achat.",f2(F.dgi)+" % × "+dh(pT)+" = "+dh(m.dgi),""],
   ["Terrain et frais","Conservation foncière ANCFCC","Taux × prix d'achat + droit fixe + certificat.",f2(F.anc)+" % × "+dh(pT)+" + "+f0(F.ancFix)+" + "+f0(F.ancCert)+" = "+dh(m.anc),""],
   ["Terrain et frais","Honoraires du notaire et TVA","Le plus grand de : taux × prix d'achat, ou minimum. Puis TVA sur ces honoraires.","Honoraires : "+dh(m.not)+" ; TVA "+f2(F.tva)+" % : "+dh(m.tva),"Minimum : "+dh(F.notMin)+". Débours et timbres : forfait "+dh(F.deb)+"."],
   ["Terrain et frais","Terrain acte en main","Prix d'achat + DGI + ANCFCC + honoraires du notaire + TVA + débours.",dh(m.tAEM),""],
   ["Terrain et frais","Architecte","Taux × total gros œuvre.",f2(F.archi)+" % × "+dh(m.go)+" = "+dh(m.archi),""],
   ["Terrain et frais","Honoraires, BET et taxes (poste de coût)","Architecte + bureau d'études + taxe communale d'autorisation de bâtir.",dh(m.archi)+" + "+dh(F.bet)+" + "+dh(F.taxe)+" = "+dh(m.honTax),""],
   ["Terrain et frais","Raccordements et imprévus","Raccordements eau et électricité (forfait) + imprévus en % × (gros œuvre + second œuvre).",dh(F.racc)+" + "+dh(m.imp)+" = "+dh(F.racc+m.imp),"Imprévus réglés à "+S.imp+" %."],
   ["Bilan commercial","Coût de revient total","Terrain acte en main + honoraires, BET et taxes + gros œuvre + second œuvre + raccordements et imprévus.",dh(m.cost),""],
   ["Bilan commercial","Chiffre d'affaires","Surface commerciale vendable × prix de vente au m².",f2(m.comm)+" × "+f0(S.pv)+" = "+dh(m.ca),""],
   ["Bilan commercial","Gain potentiel (marge brute)","Chiffre d'affaires − coût de revient total.",dh(m.ca)+" − "+dh(m.cost)+" = "+dh(m.marge),"Avant impôt sur les sociétés ou sur le revenu et avant frais de vente."],
   ["Bilan commercial","Marge au m²","Gain ÷ surface commerciale vendable.",dh(m.marge)+" ÷ "+f2(m.comm)+" = "+dh(m.mm2),""],
   ["Bilan commercial","Rentabilité (ROI)","Gain ÷ coût de revient total × 100.",f1(m.roi)+" %","Rapport au coût total engagé, pas aux fonds propres."],
   ["Bilan commercial","Prix d'équilibre au m²","Coût de revient total ÷ surface commerciale vendable. En dessous, l'opération perd de l'argent.",dh(m.cost)+" ÷ "+f2(m.comm)+" = "+dh(m.eq)+"/m²",""],
   ["Bilan commercial","Part d'un poste dans le coût","Montant du poste ÷ coût de revient total × 100.","Gros œuvre : "+f1(m.go/m.cost*100)+" %","Tableau de l'onglet Rentabilité."],
   ["Bilan commercial","Comparaison 1, 2, 3 façades","Mêmes prix, mêmes frais, mêmes étages. Seuls changent la cour, les murs et l'encorbellement de chaque configuration.","Voir l'onglet Rentabilité",""]
  ];
  var terms=norm(S.q||"").split(/\s+/).filter(Boolean);
  var shown=E.filter(function(e){var t=norm(e.join(" "));return terms.every(function(w){return t.indexOf(w)>=0;});});
  var h='<section class="pane" id="p-annexe"><div><h2>Annexe : méthode de calcul</h2><p class="hint" style="margin-bottom:10px">Chaque indicateur avec sa formule et sa valeur actuelle. Les valeurs suivent vos saisies.</p>'
   +'<div class="inp" style="max-width:440px"><input id="i_q" type="text" data-text="q" autocomplete="off" placeholder="Rechercher : ROI, notaire, carrelage, terrasse" aria-label="Rechercher un indicateur" value="'+String(S.q||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")+'" style="text-align:left"></div>'
   +'<p class="hint" style="margin-top:8px">'+shown.length+' indicateur'+(shown.length>1?'s':'')+' sur '+E.length+'.</p></div>';
  if(!shown.length)h+='<p class="hint">Aucun indicateur ne correspond. Essayez « ROI », « notaire » ou « carrelage ».</p>';
  var cats=[];shown.forEach(function(e){if(cats.indexOf(e[0])<0)cats.push(e[0]);});

    h+='<div><h2>'+c+'</h2>';

    });

/* ---------- Rendu principal ---------- */
var TABS=[["rent","Rentabilité"],["surf","Surfaces"],["go","Gros œuvre"],["so","Second œuvre"],["fees","Terrain et frais"],["annexe","Annexe"]];
function renderMain(m){
  var h=renderVerdict(m);
  h+='<div class="tabs" role="tablist">'+TABS.map(function(t){return '<button type="button" role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>';}).join("")+'</div>';
  if(S.tab==="surf")h+=paneSurf(m);
  else if(S.tab==="go")h+=paneLines("go","Gros œuvre",m.go,m);
  else if(S.tab==="so")h+=paneLines("so","Second œuvre et finitions",m.so,m);
  else if(S.tab==="fees")h+=paneFees(m);
  else if(S.tab==="annexe")h+=paneAnnex(m);
  else h+=paneRent(m);
  document.getElementById("main").innerHTML=h;
}
function render(){
  var a=document.activeElement,id=a&&a.id,s0=null,s1=null;
  try{if(a&&a.selectionStart!=null){s0=a.selectionStart;s1=a.selectionEnd;}}catch(e){}
  var m=compute(S,S.cfg);
  renderAside();renderMain(m);
  if(id){
    var el=document.getElementById(id);
    if(el){el.focus({preventScroll:true});try{if(s0!=null&&el.type==="text")el.setSelectionRange(s0,s1);}catch(e){}}
  }
}

/* ---------- Résumé copiable ---------- */
function summary(){
  var m=compute(S,S.cfg);
  return ["Skyimmo",
    "Lot de "+f0(S.S)+" m², R+"+S.nEt+", "+S.cfg+" façade(s), sol "+(S.sol==="dur"?"dur":"argileux"),
    "Surface vendable : "+f2(m.comm)+" m²",
    "Terrain acte en main : "+dh(m.tAEM),
    "Honoraires, BET et taxes : "+dh(m.honTax),
    "Gros œuvre : "+dh(m.go),
    "Second œuvre : "+dh(m.so),
    "Raccordements et imprévus : "+dh(m.racc+m.imp),
    "Coût de revient : "+dh(m.cost)+" ("+f0(m.eq)+" DH/m²)",
    "Chiffre d'affaires à "+f0(S.pv)+" DH/m² : "+dh(m.ca),
    "Gain : "+dh(m.marge)+" | ROI : "+f1(m.roi)+" %"].join("\n");
}
var tt;
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.className="on";clearTimeout(tt);tt=setTimeout(function(){e.className="";},2200);}

/* ---------- Événements ---------- */
function setPath(o,path,v){
  var p=path.split("."),c=o;
  for(var i=0;i<p.length-1;i++){if(c[p[i]]==null||typeof c[p[i]]!=="object")c[p[i]]={};c=c[p[i]];}
  c[p[p.length-1]]=v;
}
function parse(s){var t=String(s).replace(/\s/g,"").replace(",",".");if(t===""||t==="-"||t==="."||isNaN(+t))return null;return +t;}
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.chk){S[t.dataset.chk]=t.checked;save();render();return;}
  if(t.dataset&&t.dataset.text){S[t.dataset.text]=t.value;render();return;}
  if(!t.dataset||!t.dataset.path)return;
  var v=parse(t.value);if(v===null)return;
  setPath(S,t.dataset.path,v);save();render();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.path){var v=parse(t.value);if(v===null){render();}}
});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,v=b.dataset.v;
  if(a==="cfg")S.cfg=+v;
  else if(a==="sol")S.sol=v;
  else if(a==="net")S.nEt=+v;
  else if(a==="edit")S.edit=!S.edit;
  else if(a==="geoReset")S.geo=clone(DEF.geo);
  else if(a==="scen"){S.scen=v;}
  else if(a==="tab")S.tab=v;
  else if(a==="resetov")S.ov={};
  else if(a==="reset"){var tab=S.tab;S=clone(DEF);S.tab=tab;}
  else if(a==="copy"){
    var txt=summary();
    try{navigator.clipboard.writeText(txt).then(function(){toast("Résumé copié");},function(){toast("Copie impossible sur cet écran");});}
    catch(err){toast("Copie impossible sur cet écran");}
    return;
  }
  save();render();
});
render();
})();
